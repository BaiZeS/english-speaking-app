name: Release APK

# Trigger only on:
#   - tag push matching v* (e.g. v1.2.0)
#   - manual dispatch from the Actions tab (handy for hotfixes)
# Tag-driven release lets the backend's AppVersionResolver pick up the new
# version automatically (it queries GitHub Releases API for the latest tag),
# without anyone editing the .env.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to publish (e.g. v1.2.0). Leave empty to use the current ref.'
        required: false
        default: ''

permissions:
  contents: write   # needed to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # don't cancel a release that's already uploading

jobs:
  release:
    name: Build + publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          # `tools` 包 2026-09-15 起被 Google 停供, 而 action 默认 packages='tools platform-tools'
          # 会让 sdkmanager 报 "Failed to find package 'tools'" 退出 1 (action issue #537)。
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Resolve release tag
        id: tag
        run: |
          # workflow_dispatch callers may pass an explicit tag; tag pushes
          # already carry the ref. ``github.ref_name`` strips the leading
          # ``refs/tags/`` automatically for tag-triggered runs.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Export release tag
        # Done as its own step so the previous ``tag`` output is available
        # via ${{ steps.tag.outputs.value }}; the env write inside the
        # tag step's shell ended up empty because outputs aren't visible
        # to the same step that emits them.
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Derive version (strip leading v)
        id: version
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Require release signing secrets
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KAL: ${{ secrets.RELEASE_KEY_ALIAS }}
          KPW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # 宁红也不「静默换证书」: 过去缺签名配置的后果是每版一把 debug key,
          # 用户装了新包才发现装不上 (更新包与已安装应用的签名不一致), 而 CI 全绿。
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            case "$name" in
              RELEASE_KEYSTORE_BASE64) value="$KS" ;;
              RELEASE_STORE_PASSWORD) value="$KSP" ;;
              RELEASE_KEY_ALIAS) value="$KAL" ;;
              RELEASE_KEY_PASSWORD) value="$KPW" ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::缺少 Actions Secret: $name (配置步骤见 docs/operations.md §3.1.1)"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/english-assistant-release.jks"
          ls -l "$RUNNER_TEMP/keystore/english-assistant-release.jks"

      - name: Build release APK (signed)
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/keystore/english-assistant-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Install pinned build-tools (apksigner 与本机同版)
        run: |
          # 断言用的 apksigner 必须与本机/门禁脚本同版：run#20 用了镜像里更新的版本，
          # --print-certs 的措辞与 sed 模式对不上，把「签名正确」误判成「读不出证书」。
          # 路径不猜死：AGP 能构建成功说明 build-tools 存在，只是未必在 $ANDROID_HOME 下。
          FOUND=""
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Android/Sdk" /usr/local/lib/android/sdk /opt/android-sdk; do
            [ -n "$d" ] && [ -d "$d" ] || continue
            c=$(ls "$d"/build-tools/34.0.0/apksigner 2>/dev/null || true)
            if [ -n "$c" ]; then FOUND="$c"; break; fi
          done
          if [ -n "$FOUND" ]; then
            echo "已有 34.0.0: $FOUND"
            exit 0
          fi
          MGR=""
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Android/Sdk" /usr/local/lib/android/sdk; do
            [ -n "$d" ] || continue
            for c in "$d"/cmdline-tools/latest/bin/sdkmanager "$d"/cmdline-tools/bin/sdkmanager; do
              [ -x "$c" ] && MGR="$c" && break 2
            done
          done
          if [ -z "$MGR" ]; then
            echo "::warning::找不到 sdkmanager，跳过安装；断言步会自行定位 apksigner"
            exit 0
          fi
          echo "sdkmanager: $MGR"
          yes | "$MGR" --sdk_root="$(dirname "$(dirname "$MGR")")" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Assert signing certificate fingerprint
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          # 产物证书必须是那把长期密钥。历史上这里什么都没有, 于是「每版换证书」
          # 的包一路绿灯发到了手机上才炸。
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::找不到产物 $APK (构建没出 release 包?)"
            ls -l "$(dirname "$APK")" 2>/dev/null || true
            exit 1
          fi
          # apksigner 不猜死路径: AGP 能构建成功说明 build-tools 存在, 但未必在 $ANDROID_HOME 下
          # (run#21 的 ls /usr/local/lib/android/sdk/build-tools/* 就是空的)。
          APKSIGNER=""
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Android/Sdk" /usr/local/lib/android/sdk /opt/android-sdk; do
            [ -n "$d" ] || continue
            c="$d/build-tools/34.0.0/apksigner"
            if [ -x "$c" ]; then APKSIGNER="$c"; break; fi
            if [ -z "$APKSIGNER" ]; then
              alt="$(ls "$d"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
              [ -n "$alt" ] && APKSIGNER="$alt"
            fi
          done
          echo "apksigner = ${APKSIGNER:-<未找到>}"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::runner 上没有 apksigner (build-tools 没装上), 无法断言签名"
            exit 1
          fi
          # 原始输出先落日志: 措辞再变也看得到, 不再让 sed 空转伪装成「没签名」。
          RAW="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"
          printf '%s\n' "$RAW"
          ACTUAL="$(printf '%s\n' "$RAW" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ' ')"
          echo "actual certificate SHA-256 = $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "::error::读不出产物签名证书 (上面的原始输出就是原因)"
            exit 1
          fi
          if [ -n "$EXPECTED" ]; then
            if [ "$(printf '%s' "$ACTUAL" | tr 'A-F' 'a-f')" != "$(printf '%s' "$EXPECTED" | tr -d ':' | tr 'A-F' 'a-f')" ]; then
              echo "::error::签名证书与 RELEASE_CERT_SHA256 不一致, 拒绝发布"
              echo "  expected = $EXPECTED"
              exit 1
            fi
            echo "certificate matches RELEASE_CERT_SHA256"
          else
            echo "::warning::未配 repository variable RELEASE_CERT_SHA256, 本轮只构建不断言"
          fi

      - name: Rename APK to versioned asset name
        # Release UI is much friendlier when the asset shows e.g.
        # EnglishAssistant-1.2.0.apk; the backend's default glob
        # (EnglishAssistant-*.apk) picks this up automatically.
        working-directory: android
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "EnglishAssistant-${{ steps.version.outputs.value }}.apk"
          ls -lh EnglishAssistant-${{ steps.version.outputs.value }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "English Assistant ${{ steps.version.outputs.value }}"
          body: |
            ## English Assistant ${{ steps.version.outputs.value }}

            Auto-published by `.github/workflows/release.yml`. The APK below is
            picked up by the in-app auto-update flow once the backend's
            `APP_GITHUB_REPO` is configured (see `backend/README.md`).
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            android/EnglishAssistant-${{ steps.version.outputs.value }}.apk
          fail_on_unmatched_files: true
